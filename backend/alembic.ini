# Alembic Configuration File
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file
script_location = migrations

# Template for generating new migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path adjustment — add the backend directory so env.py can import config
prepend_sys_path = .

# Timezone for timestamps in migration files
timezone = UTC

# Maximum length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command (allows
# autogenerate to detect changes from database).
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
sourceless = false

# Version location; default is %(here)s/versions
version_locations = %(here)s/versions

# The output encoding used when revision files are written from script.mako
output_encoding = utf-8

# Database URL — overridden by env.py reading from environment variables
sqlalchemy.url = postgresql+psycopg2://cortexsoc:cortexsoc_secret@localhost:5432/cortexsoc


[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
