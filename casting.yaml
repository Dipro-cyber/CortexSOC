# ─────────────────────────────────────────────────────────────────────────────
# CortexSOC — Foundry / SigNoz Deployment Configuration
# Deploy SigNoz self-hosted observability backend via:
#   docker compose -f casting.yaml up -d
# ─────────────────────────────────────────────────────────────────────────────

name: cortexsoc-signoz

services:
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"

  clickhouse:
    image: clickhouse/clickhouse-server:24.1.5
    container_name: signoz_clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  schema-migrator:
    image: signoz/signoz-schema-migrator:latest
    container_name: signoz_schema_migrator
    command: ["sync", "--dsn=tcp://clickhouse:9000"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  signoz-query-service:
    image: signoz/query-service:latest
    container_name: signoz-query-service
    ports:
      - "8080:8080"
    environment:
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_ALERTMANAGER_LEGACY_API__URL=http://alertmanager:9093/api/
      - SIGNOZ_JWT_SECRET_KEY=cortexsoc_signoz_jwt_secret_key_12345
      - JWT_SECRET_KEY=cortexsoc_signoz_jwt_secret_key_12345
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - signoz_data:/var/lib/signoz

  frontend:
    image: signoz/frontend:latest
    container_name: signoz_frontend
    ports:
      - "3301:3301"
    volumes:
      - ./signoz-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./signoz-index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - signoz-query-service

  alertmanager:
    image: signoz/alertmanager:0.23.7
    container_name: signoz_alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - signoz-query-service

volumes:
  signoz_data:
    name: cortexsoc_signoz_data
  clickhouse_data:
    name: cortexsoc_clickhouse_data
